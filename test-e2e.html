<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>test-e2e</title></head>
<body><pre id="out">début e2e…</pre>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };
const PAL = new Set(['0,0,0','255,255,255','255,255,0','255,0,0','0,0,255','0,255,0']);
(async () => {
  // charger l'outil réel en iframe (même origine)
  const fr = document.createElement('iframe');
  fr.style.cssText = 'width:900px;height:700px';
  fr.src = '/';
  document.body.appendChild(fr);
  await new Promise(r => fr.onload = r);
  await new Promise(r => setTimeout(r, 1500));
  const win = fr.contentWindow;
  if(typeof win.handleFiles !== 'function') { log('ERREUR : handleFiles inaccessible'); return; }
  const results = fr.contentWindow.eval('results');
  log('outil réel chargé (iframe) — handleFiles + results accessibles ✓');

  for(const [fich, dimAtt] of [['test-1350x1350.heic','800x480'], ['test-300x200.heic','800x480']]) {
    const resp = await fetch(fich);
    const file = new File([await resp.arrayBuffer()], fich, { type: 'image/heic' });
    const t0 = Date.now();
    const n0 = results.length;
    win.handleFiles([file]);
    while(results.length === n0) await new Promise(r => setTimeout(r, 120));
    const ms = Date.now() - t0;
    const r = results[results.length - 1];
    if(!r || !r.name.endsWith('.bmp')) { log(fich + ' : ERREUR — aucun résultat BMP'); continue; }
    log('');
    log(fich + ' → ' + r.name + ' (' + r.w + 'x' + r.h + ', ' + (r.blob.size/1024).toFixed(0) + ' Ko, ' + ms + ' ms)');
    log('   note : ' + r.note);
    // vérification byte par byte du BMP
    const buf = new Uint8Array(await r.blob.arrayBuffer());
    const dv = new DataView(buf.buffer);
    const w = dv.getInt16(18, true), h = dv.getInt16(22, true), bits = dv.getUint16(28, true);
    const okSize = buf.length === w*h*3 + 54;
    const okDim = (w + 'x' + h) === dimAtt;
    // BMP bottom-up BGR : vérifier tous les pixels
    const rowSize = Math.ceil(w*3/4)*4;
    let bad = 0, colors = {};
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const off = 54 + (h-1-y)*rowSize + x*3;
      const rgb = buf[off+2] + ',' + buf[off+1] + ',' + buf[off];
      if(!PAL.has(rgb)) bad++;
      colors[rgb] = (colors[rgb]||0) + 1;
    }
    const top = Object.entries(colors).sort((a,b)=>b[1]-a[1]).slice(0,4).map(c=>c[0]+'×'+c[1]).join('  ');
    log('   BMP : ' + buf.length + ' octets ' + (okSize?'✓':'✗') + ' | ' + w + 'x' + h + ' ' + (okDim?'✓':'✗') + ' | ' + bits + ' bits ' + (bits===24?'✓':'✗'));
    log('   pixels hors palette : ' + bad + ' ' + (bad===0?'✓':'✗'));
    log('   couleurs dominantes : ' + top);
    if(!okSize || !okDim || bad) log('   ❌ ÉCHEC E2E ' + fich);
    else log('   ✅ E2E OK — HEIC → BMP 6 couleurs valide');
  }
  log('');
  log('FIN E2E');
})();
</script></body></html>
